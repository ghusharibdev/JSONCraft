<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#818cf8"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:0"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Subtle grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Glow circle -->
  <circle cx="600" cy="280" r="200" fill="url(#glow)"/>
  
  <!-- Logo icon -->
  <rect x="530" y="160" width="140" height="140" rx="24" fill="url(#accent)"/>
  <text x="600" y="250" font-family="monospace" font-size="56" font-weight="bold" fill="white" text-anchor="middle">{ }</text>
  
  <!-- Brand name -->
  <text x="600" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="-2">JSONCraft</text>
  
  <!-- Tagline -->
  <text x="600" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="400" fill="#94a3b8" text-anchor="middle">Format, Validate, Minify &amp; Beautify JSON</text>
  
  <!-- Feature pills -->
  <rect x="280" y="470" width="160" height="44" rx="22" fill="rgba(99,102,241,0.15)" stroke="rgba(99,102,241,0.3)" stroke-width="1"/>
  <text x="360" y="498" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#818cf8" text-anchor="middle">100% Client-Side</text>
  
  <rect x="470" y="470" width="130" height="44" rx="22" fill="rgba(99,102,241,0.15)" stroke="rgba(99,102,241,0.3)" stroke-width="1"/>
  <text x="535" y="498" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#818cf8" text-anchor="middle">Free to Use</text>
  
  <rect x="630" y="470" width="120" height="44" rx="22" fill="rgba(99,102,241,0.15)" stroke="rgba(99,102,241,0.3)" stroke-width="1"/>
  <text x="690" y="498" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#818cf8" text-anchor="middle">No Sign Up</text>
  
  <rect x="780" y="470" width="140" height="44" rx="22" fill="rgba(99,102,241,0.15)" stroke="rgba(99,102,241,0.3)" stroke-width="1"/>
  <text x="850" y="498" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#818cf8" text-anchor="middle">Private &amp; Secure</text>
  
  <!-- Bottom URL -->
  <text x="600" y="580" font-family="monospace" font-size="18" fill="#64748b" text-anchor="middle">jsoncraft-app.pages.dev</text>
</svg>
